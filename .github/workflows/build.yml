name: Validate and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7-stable
          curl --fail --location --retry 3 "$base/Godot_v4.7-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl --fail --location --retry 3 "$base/Godot_v4.7-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"
          godot --version
      - name: Validate every test suite and export the Windows development build
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot scripts/validate.sh --export
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EchoRidge-Windows-development
          path: builds/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7 and a virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
      - name: Render menu and mission screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          timeout 120s godot --headless --path . --editor --quit >/dev/null 2>&1 || true
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 --script res://tools/capture.gd -- "$PWD/screenshots" 2>&1 | tee screenshots/capture.log
          test "$(ls screenshots/*.png | wc -l)" -ge 10
          if grep -E 'SCRIPT ERROR:' screenshots/capture.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoRidge-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
