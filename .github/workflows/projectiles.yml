name: Projectile regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  projectiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and run ballistic and projectile suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          timeout 90s godot --headless --path . --editor --quit 2>&1 | tee reports/projectile-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' reports/projectile-import.log; then exit 1; fi
          timeout 90s godot --headless --path . --script res://tests/ballistics_test.gd 2>&1 | tee reports/ballistics.log
          if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' reports/ballistics.log; then exit 1; fi
          grep -q 'Ballistics: 8 checks, 0 failures' reports/ballistics.log
          timeout 90s godot --headless --path . --script res://tests/projectiles.gd 2>&1 | tee reports/projectiles.log
          if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' reports/projectiles.log; then exit 1; fi
          grep -q 'PROJECTILE TESTS PASSED' reports/projectiles.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectile-validation-logs
          path: reports/
          if-no-files-found: warn
          retention-days: 14
